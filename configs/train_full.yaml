# Full training run with walk-forward validation
# Usage: python -m app.main run-train --config configs/train_full.yaml

data:
  path: /mnt/Data/archive/raw_data
  assets:
    - BTC
    - ETH
  cache_dir: /mnt/Data/.cache/data
  max_workers: 8
  # Data slice used before train/val/test splitting.
  # For a short experiment, move start_date closer to end_date (or set end_date explicitly).
  # Example short slice: start_date: "2024-01-01", end_date: "2024-03-31"
  start_date: "2025-01-01"
  end_date: "2025-07-01"
  # end_date: null   # null = include data up to latest available timestamp

splits:
  test_days: 90          # final holdout length (days), excluded from training
  train_window_days: 60  # training span per walk-forward fold (days)
  val_window_days: 14    # validation span per fold (days)
  gap_days: 3            # gap between train and val to reduce leakage (days)
  step_days: 14          # fold advance step (days); smaller = more folds/slower
  # Short-period tip:
  # - reduce test_days/train_window_days/val_window_days together
  # - keep: train_window_days > val_window_days + gap_days

horizons:
  - 1  # evaluate PnL at +1 day after entry
  - 3  # evaluate PnL at +3 days after entry

strategies:
  - straddle
  - vertical_spread

execution:
  model: mid
  slippage_bps: 0.0

fees:
  pct_of_underlying: 0.0003
  max_pct_of_option: 0.125

calculator:
  assets:
    - BTC
    - ETH
  rv_window: 20
  iv_rv_threshold: 0.05
  min_oi: 10.0
  min_strikes: 3
  target_dte_min: 7
  target_dte_max: 45
  straddle_moneyness_tol: 0.02
  smile_slope_threshold: 0.0

sandbox:
  timeout_seconds: 120
  allowed_imports:
    - __future__
    - numpy
    - pandas
    - scipy
    - math
    - statistics
    - itertools
    - functools
    - collections
    - typing
    - datetime
    - re
    - copy
    - warnings
  verify_determinism: true

optimization:
  search_space:
    iv_rv_threshold: [0.03, 0.05, 0.08, 0.10]
    target_dte_min: [7, 14]
    target_dte_max: [30, 45, 60]
    smile_slope_threshold: [0.0, 0.005, 0.01]

promotion:
  objective: sharpe
  max_nan_rate_delta: 0.05
  max_drawdown_pct_delta: 0.10

llm:
  provider: anthropic
  model: claude-opus-4-5
  max_tokens: 8192
  temperature: 0.2
  api_key_env: ANTHROPIC_API_KEY
  max_llm_requests: 10

output:
  reports_dir: reports
  artifacts_dir: artifacts
